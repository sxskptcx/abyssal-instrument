<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>ABYSSAL — Acoustic Lab (Glass &amp; Droplets: Option A)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: rgba(200, 215, 230, 0.55);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #touchSurface {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      touch-action: none;
      cursor: crosshair;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-size: 12px;
      letter-spacing: 0.14em;
      transition: opacity 0.9s ease;
      text-align: center;
      padding: 24px;
      white-space: pre-wrap;
    }

    #status.hidden {
      opacity: 0;
    }

    #telemetry {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(165, 195, 225, 0.30);
      opacity: 0;
      transition: opacity 0.6s ease;
      white-space: nowrap;
    }

    #telemetry.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="touchSurface"></div>
  <div id="status">TAP TO LOAD CSOUND ACOUSTIC ENGINE</div>
  <div id="telemetry"></div>

  <script type="module" src="./src/csound-host.js?v=7"></script>
</body>
</html>
